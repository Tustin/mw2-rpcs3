services:
  mw2-server:
    build: .
    environment:
      MW2_LOG_LEVEL: debug
      MW2_LOG_SENSITIVE: ${MW2_LOG_SENSITIVE:-false}
      MW2_MOTD: ${MW2_MOTD:-}
      MW2_CAPTURE_DIR: /data/captures
      MW2_CAPTURE_ENABLED: "false"
      MW2_NAT_ADVERTISED_IP: ${MW2_NAT_ADVERTISED_IP:?set MW2_NAT_ADVERTISED_IP to the client-reachable host IPv4}
      MW2_NAT_RELAY_ENABLED: ${MW2_NAT_RELAY_ENABLED:-false}
      MW2_MATCHMAKING_SUPPRESS_SELF_ONLY: ${MW2_MATCHMAKING_SUPPRESS_SELF_ONLY:-false}
      MW2_MATCHMAKING_PREFER_EARLIER_HOSTS: ${MW2_MATCHMAKING_PREFER_EARLIER_HOSTS:-false}
      MW2_BANDWIDTH_SEND_DURATION_MS: ${MW2_BANDWIDTH_SEND_DURATION_MS:-50}
      MW2_BANDWIDTH_FINALIZE_RECEIVE_PERIOD_MS: ${MW2_BANDWIDTH_FINALIZE_RECEIVE_PERIOD_MS:-}
      MW2_HTTP_ADDR: :8080
      MW2_ADMIN_ENABLED: ${MW2_ADMIN_ENABLED:-true}
      MW2_PLAYLISTS_FILE: /data/playlists.info
      MW2_PROFILE_DB_PATH: /data/mw2-profiles.db
    ports:
      - "3074:3074/tcp"
      - "3074:3074/udp"
      - "3075:3075/tcp"
      - "3075:3075/udp"
      - "2005:2005/udp"
      - "${MW2_HTTP_HOST_PORT:-80}:8080/tcp"
    volumes:
      - ./captures:/data/captures
      - mw2-data:/data
    restart: unless-stopped

  ps3-dns:
    build: ./dns-server
    environment:
      MW2_DNS_REDIRECT_IP: ${MW2_DNS_REDIRECT_IP:-${MW2_NAT_ADVERTISED_IP:?set MW2_DNS_REDIRECT_IP or MW2_NAT_ADVERTISED_IP to the client-reachable host IPv4}}
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped

volumes:
  mw2-data:
